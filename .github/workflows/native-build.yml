name: GraalVM Native Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  native:
    name: Native Image Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up GraalVM JDK 21
        uses: graalvm/setup-graalvm@27b360dbb857524eaf0b4c4cef364d38e5b4f173 # v1
        with:
          java-version: '21'
          distribution: graalvm-community
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # The sample depends on the other modules, which a fresh runner does not have in ~/.m2.
      - name: Install the starter modules
        run: ./mvnw -B -DskipTests -pl sample -am install --no-transfer-progress

      - name: Build native image (sample app)
        run: ./mvnw -B -pl sample native:compile -Pnative --no-transfer-progress

      - name: Smoke-test native binary
        run: |
          ./sample/target/audit-sample &
          sleep 5
          curl -sf http://localhost:8080/actuator/health | grep '"status":"UP"'
          kill %1
