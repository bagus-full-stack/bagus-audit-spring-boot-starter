name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Test (Java ${{ matrix.java }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java: [ '17', '21' ]

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          java-version: ${{ matrix.java }}
          distribution: temurin
          cache: maven

      - name: Build and test
        run: ./mvnw -B verify --no-transfer-progress

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: surefire-reports-java${{ matrix.java }}
          path: '**/target/surefire-reports/'

  # The real stack: PostgreSQL, a mock identity provider and two app instances on one database.
  # `mvn verify` cannot see a broken production profile (issuer, audience, pool) or a multi-instance problem.
  docker-stack:
    name: Docker stack checks
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Start the stack
        run: docker compose -f docker-compose.yml -f docker-compose.multi.yml up -d --build

      - name: Smoke test
        run: ./docker/smoke-test.sh

      - name: Two instances on one database
        run: ./docker/multi-instance-test.sh

      - name: Show the logs when a check failed
        if: failure()
        run: docker compose -f docker-compose.yml -f docker-compose.multi.yml logs --no-color

      - name: Stop the stack
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.multi.yml down -v
